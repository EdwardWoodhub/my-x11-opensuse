name: Build Xfce OS Based On openSUSE

on:
  workflow_dispatch:
    inputs:
      release_iso:
        description: '是否发布 ISO 到 Release'
        required: true
        default: true
        type: boolean

  schedule:
    # 每天 UTC 20:00（北京时间次日 04:00）运行
    - cron: '0 20 * * *'

  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/*.md'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 动态计算镜像 Tag 与包名（统一转换为小写）
      - name: Compute Image Tag & Version
        id: vars
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${REPO_OWNER}/my-x11-opensuse-vm" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "tag=daily-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=manual-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "tag=commit-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      # 步骤 1：构建 OCI 镜像并推送到 GHCR
      - name: Build and Push OCI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:latest

      # 步骤 2：打包成 LiveCD ISO
      - name: Generate LiveCD ISO
        run: |
          docker run --rm -v $(pwd):/workspace -w /workspace --privileged \
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.tag }} \
            elemental build-iso \
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.tag }} \
            -o . \
            -n my-x11-opensuse-vm
            
      

      # 步骤 3：发布 ISO
      - name: Publish ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: |
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.release_iso == true)
        with:
          files: my-x11-opensuse-vm.iso
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Build ${{ steps.vars.outputs.tag }}"
          generate_release_notes: true
          
      
