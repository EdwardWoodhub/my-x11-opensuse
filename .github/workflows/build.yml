name: Build Xfce OS Based On openSUSE

on:
  workflow_dispatch:
    inputs:
      release_iso:
        description: '是否发布 ISO 到 Release'
        required: true
        default: true
        type: boolean

  schedule:
    # 每天 UTC 19:23（北京时间次日 03:23）运行
    - cron: '23 19 * * *'

  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/*.md'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: my-x11-opensuse-vm
  ACTOR_LOWER: edwardwoodhub

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================================================================
      # 1. 登录 GHCR
      # =========================================================================
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      # 动态计算镜像 Tag 与包名（统一转换为小写）
      - name: Compute Image Tag & Version
        id: vars
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${REPO_OWNER}/my-x11-opensuse-vm" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "tag=daily-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=manual-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "tag=commit-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      # =========================================================================
      # 2. 构建并仅推送到 GHCR（供后续 ISO 构建使用）
      # =========================================================================
      - name: Build and Push OCI Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:latest

      # 步骤 3：打包成 LiveCD ISO
      - name: Generate LiveCD ISO
        run: |
          docker run --rm -v $(pwd):/workspace -w /workspace --privileged \
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.tag }} \
            elemental build-iso \
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.tag }} \
            -o . \
            -n my-x11-opensuse-vm

      # 步骤 4：将大于 2GB 的 ISO 切割为多个 1.5GB 的文件
      - name: Split ISO
        run: |
          split -b 1500M my-x11-opensuse-vm.iso my-x11-opensuse-vm.iso.part-

      # 步骤 5：发布切割后的 ISO 分卷到 GitHub Releases
      - name: Publish ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: |
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.release_iso == true)
        with:
          files: my-x11-opensuse-vm.iso.part-*
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Build ${{ steps.vars.outputs.tag }}"
          generate_release_notes: true

      # =========================================================================
      # 6. 末尾：登录并同步镜像到阿里云 ACR
      # =========================================================================
      - name: Log in to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Push Image to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          GHCR_TAG_IMAGE="${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.tag }}"
          ALIYUN_TAG_IMAGE="${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ secrets.ALIYUN_ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}"
          ALIYUN_LATEST_IMAGE="${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ secrets.ALIYUN_ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest

          # 确保拉取镜像（如果本地 daemon 中已有则直接使用）
          docker pull "$GHCR_TAG_IMAGE"

          # 打标签
          docker tag "$GHCR_TAG_IMAGE" "$ALIYUN_TAG_IMAGE"
          docker tag "$GHCR_TAG_IMAGE" "$ALIYUN_LATEST_IMAGE"

          # 推送到阿里云 ACR
          docker push "$ALIYUN_TAG_IMAGE"
          docker push "$ALIYUN_LATEST_IMAGE"
