name: Build Xfce OS Based On openSUSE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/opensuse-desktop

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 任务 1：构建分层 OCI 操作系统镜像并推送到 GHCR
      - name: Build and Push OCI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name || 'latest' }}

      # 任务 2：将刚推送的 OCI 镜像打成可启动的 LiveCD ISO
      - name: Generate LiveCD ISO
        run: |
          docker run --rm -v $(pwd):/workspace -w /workspace --privileged \
            ghcr.io/rancher/elemental-toolkit/elemental-toolkit:latest \
            elemental build-iso \
            --system-image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name || 'latest' }} \
            -o opensuse16-desktop-live.iso

      # 任务 3：将 ISO 发布到 GitHub Releases 提供对外下载
      - name: Publish ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: opensuse16-desktop-live.iso
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
